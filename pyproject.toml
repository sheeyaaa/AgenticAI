[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prd-to-selenium-agents"
version = "0.1.0"
description = "ADK multi-agent PRD to Selenium test generation pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-adk>=1.15.0",
  "litellm>=1.60.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "mcp>=1.2,<2",
  "crewai==0.102.0",
  "a2a-sdk>=0.2",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
  "selenium>=4.27",
  "flake8>=7.1",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["api*", "prd_agents*", "mcp_server*", "messaging*", "a2a_service*"]
